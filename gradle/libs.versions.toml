[versions]
agp             = "8.5.2"
kotlin          = "2.0.21"
ksp             = "2.0.21-1.0.28"
core-ktx        = "1.13.1"
appcompat       = "1.7.0"
material        = "1.12.0"
constraintlayout= "2.1.4"
lifecycle       = "2.8.6"
work            = "2.9.1"
room            = "2.6.1"
coroutines      = "1.9.0"
okhttp          = "4.12.0"
coil            = "2.7.0"
recyclerview    = "1.3.2"
swiperefresh    = "1.1.0"
gson            = "2.11.0"

[libraries]
androidx-core-ktx           = { group = "androidx.core",             name = "core-ktx",                  version.ref = "core-ktx" }
androidx-appcompat          = { group = "androidx.appcompat",        name = "appcompat",                 version.ref = "appcompat" }
material                    = { group = "com.google.android.material",name = "material",                  version.ref = "material" }
androidx-constraintlayout   = { group = "androidx.constraintlayout", name = "constraintlayout",          version.ref = "constraintlayout" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",     version.ref = "lifecycle" }
androidx-lifecycle-viewmodel= { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-ktx",   version.ref = "lifecycle" }
androidx-work-runtime       = { group = "androidx.work",             name = "work-runtime-ktx",          version.ref = "work" }
androidx-room-runtime       = { group = "androidx.room",             name = "room-runtime",              version.ref = "room" }
androidx-room-ktx           = { group = "androidx.room",             name = "room-ktx",                  version.ref = "room" }
androidx-room-compiler      = { group = "androidx.room",             name = "room-compiler",             version.ref = "room" }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp                       = { group = "com.squareup.okhttp3",     name = "okhttp",                     version.ref = "okhttp" }
coil-compose                 = { group = "io.coil-kt",               name = "coil",                       version.ref = "coil" }
androidx-recyclerview        = { group = "androidx.recyclerview",    name = "recyclerview",               version.ref = "recyclerview" }
androidx-swiperefreshlayout   = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout",     version.ref = "swiperefresh" }
gson                           = { group = "com.google.code.gson",        name = "gson",                     version.ref = "gson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
